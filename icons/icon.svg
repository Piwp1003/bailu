    <circle cx="300" cy="130" r="2.2" opacity=".6"/><circle cx="84" cy="196" r="2.4" opacity=".6"/>
    <path d="M232 150l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity=".85"/>
  </g>
