      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#c)">
