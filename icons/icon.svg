<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a4d"/>
      <stop offset="0.55" stop-color="#3f5a8c"/>
      <stop offset="1" stop-color="#b9cde6"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.38" cy="0.62" r="0.75">
